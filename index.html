<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Para ti ❤️</title>

    <link rel="stylesheet" href="css/portada.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Great+Vibes&family=Montserrat:wght@300;400;500;600&display=swap"
        rel="stylesheet">

</head>


<body>


    <!-- =========================================
         FONDO
    ========================================== -->

    <div class="fondo">

        <div class="brillo brillo-1"></div>
        <div class="brillo brillo-2"></div>

    </div>


    <!-- =========================================
         CORAZONES FLOTANTES
    ========================================== -->

    <div class="corazones">

        <span>♥</span>
        <span>♥</span>
        <span>♥</span>
        <span>♥</span>
        <span>♥</span>
        <span>♥</span>
        <span>♥</span>
        <span>♥</span>

    </div>


    <!-- =========================================
         PORTADA
    ========================================== -->

    <main class="portada">


        <section class="contenido-portada">


            <!-- Pequeña etiqueta -->

            <p class="etiqueta">

                PARA TI

            </p>


            <!-- Título -->

            <h1>

                Para el amor
                de mi vida

                <span>Mi Moshi</span>

            </h1>


            <!-- Ornamento -->

            <div class="ornamento">

                <span>♥</span>

                <div></div>

                <span>♥</span>

            </div>


            <!-- Mensaje -->

            <p class="subtitulo">

                Ojitos de tortilla preparé algo pequeño para ti,
                pero con muchísimo amor.

            </p>


            <p class="mensaje">

                Hay cosas que no quiero decirte
                solo en un mensaje.

                <br>

                Quiero que las leas
                y las guardes.

            </p>


            <!-- =====================================
                 SOBRE
            ====================================== -->

            <div class="sobre">

                <div class="sobre-sombra"></div>

                <div class="sobre-cuerpo">

                    <div class="sobre-solapa"></div>

                    <div class="sello">

                        <span>♥</span>

                    </div>

                    <div class="lineas-sobre">

                        <span></span>
                        <span></span>

                    </div>

                </div>

            </div>


            <!-- =====================================
                 BOTÓN
            ====================================== -->

            <button
                id="abrirCarta"
                class="boton-carta"
                type="button"
            >

                <span class="icono">
                    💌
                </span>

                <span>
                    Abrir mi regalo
                </span>

                <strong>
                    →
                </strong>

            </button>


            <!-- Texto inferior -->

            <p class="pequeno">

                Hecho especialmente para ti Ojitos de tortilla
                <span>♥</span>

            </p>


        </section>


    </main>


    <!-- =========================================
         SCRIPT
    ========================================== -->

    <script src="js/portada.js"></script>


</body>

</html>
